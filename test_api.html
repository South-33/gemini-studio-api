<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Studio API Tester</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0b1e;
            --bg-card: #14152e;
            --bg-input: #1b1c3a;
            --accent-primary: #7c4dff;
            --accent-secondary: #00e5ff;
            --text-main: #e0e0e0;
            --text-dim: #9499c3;
            --user-bubble: #311b92;
            --bot-bubble: #1b1c3a;
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 0 20px rgba(124, 77, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-primary) var(--bg-deep);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar / Config */
        .sidebar {
            width: 340px;
            background: var(--bg-card);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 24px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .config-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input,
        select,
        textarea {
            background: var(--bg-input);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.3);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            margin-top: auto;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff5252;
        }

        .status-dot.online {
            background: #00e676;
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1rem;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(49, 27, 146, 0.3);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--bot-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            display: block;
        }

        .thinking {
            font-style: italic;
            color: var(--accent-secondary);
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Input Area */
        .input-area {
            background: rgba(10, 11, 30, 0.8);
            backdrop-filter: blur(20px);
            padding: 24px 40px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            min-height: 60px;
            max-height: 200px;
            resize: none;
            padding-right: 140px;
            /* Space for buttons */
        }

        .actions {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: var(--shadow-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: #25264d;
        }

        /* Image Preview Overlay */
        .image-previews {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preview-item {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            position: relative;
            background-size: cover;
            background-position: center;
            border: 1px solid var(--accent-primary);
        }

        .preview-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff5252;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Toggle Switch */
        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .toggle input {
            display: none;
        }

        .slider {
            width: 40px;
            height: 20px;
            background: var(--bg-input);
            border-radius: 20px;
            position: relative;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: 0.3s;
        }

        .toggle input:checked+.slider {
            background: var(--accent-primary);
        }

        .toggle input:checked+.slider:before {
            transform: translateX(20px);
        }

        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            margin: 10px 0;
            overflow-x: auto;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Mobile tweaks */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                height: auto;
            }

            .chat-window {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
                    fill="url(#grad)" />
                <defs>
                    <linearGradient id="grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7c4dff" />
                        <stop offset="1" stop-color="#00e5ff" />
                    </linearGradient>
                </defs>
            </svg>
            <span>Gemini Studio</span>
        </div>

        <div class="config-group">
            <label>API Endpoint</label>
            <input type="text" id="api-url" value="" placeholder="https://...">
        </div>

        <div class="config-group">
            <label>Model</label>
            <select id="model-select">
                <option value="gemini-3-pro-preview">Gemini 3.0 Pro</option>
                <option value="gemini-3-flash-preview" selected>Gemini 3.0 Flash</option>
                <option value="gemini-2.5-flash">2.5 Flash</option>
            </select>
        </div>

        <div class="config-group">
            <label>Thinking Level</label>
            <select id="thinking-select">
                <option value="Minimal">Minimal</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High" selected>High</option>
            </select>
        </div>

        <div class="config-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
            <label>Google Search</label>
            <label class="toggle">
                <input type="checkbox" id="search-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="config-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
            <label>Streaming</label>
            <label class="toggle">
                <input type="checkbox" id="stream-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="status-badge">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Checking API...</span>
        </div>

        <div id="bandwidth-info" style="font-size: 0.75rem; color: var(--text-dim); line-height: 1.4;">
            Bandwidth: -- / -- MB
        </div>

        <button class="btn btn-secondary" onclick="checkHealth()" style="width: 100%; justify-content: center;">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path
                    d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z" />
                <path fill-rule="evenodd"
                    d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9a5.002 5.002 0 0 0-9.457-2.023L2.393 3.615l1.411-1.411a.5.5 0 0 1 .708 0L6 3.707l1.414-1.414a.5.5 0 0 1 .708 0L8 3z" />
            </svg>
            Refresh Status
        </button>

    </aside>

    <main class="main-container">
        <div class="chat-window" id="chat-window">
            <div class="message assistant">
                Hello! I'm your Gemini Studio bridge. How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <div class="image-previews" id="image-previews"></div>

            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Type your message..." rows="1"></textarea>
                <div class="actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()"
                        title="Upload Image">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z" />
                            <path
                                d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
                        </svg>
                    </button>
                    <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">
                        <span>Send</span>
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path
                                d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z" />
                        </svg>
                    </button>
                </div>
            </div>
            <input type="file" id="file-input" style="display: none;" multiple accept="image/*"
                onchange="handleFiles(this.files)">
        </div>
    </main>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const imagePreviews = document.getElementById('image-previews');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const bandwidthInfo = document.getElementById('bandwidth-info');

        let attachedImages = [];

        // Auto-resize textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
        });

        // Health Check
        async function checkHealth() {
            const baseUrl = document.getElementById('api-url').value.trim();
            statusText.innerText = 'Checking...';
            statusDot.className = 'status-dot';

            try {
                const res = await fetch(`${baseUrl}/health`);
                const data = await res.json();

                if (data.status === 'ok') {
                    statusDot.classList.add('online');
                    statusText.innerText = 'Online - Ready';
                    updateBandwidth(baseUrl);
                } else {
                    statusText.innerText = 'Error: Service Issues';
                }
            } catch (e) {
                statusText.innerText = 'Offline - Check URL';
            }
        }

        async function updateBandwidth(baseUrl) {
            try {
                const res = await fetch(`${baseUrl}/bandwidth`);
                const data = await res.json();
                bandwidthInfo.innerText = `Bandwidth: ${data.used_mb} / ${data.limit_mb} MB (${data.percent_used}%)`;
            } catch (e) {
                bandwidthInfo.innerText = 'Bandwidth: N/A';
            }
        }

        // Image Handling
        function handleFiles(files) {
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    attachedImages.push(base64);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreviews() {
            imagePreviews.innerHTML = '';
            attachedImages.forEach((src, idx) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.style.backgroundImage = `url(${src})`;

                const remove = document.createElement('div');
                remove.className = 'preview-remove';
                remove.innerHTML = '&times;';
                remove.onclick = () => {
                    attachedImages.splice(idx, 1);
                    renderPreviews();
                };

                div.appendChild(remove);
                imagePreviews.appendChild(div);
            });
        }

        // Send Message
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && attachedImages.length === 0) return;

            const baseUrl = document.getElementById('api-url').value.trim();
            const model = document.getElementById('model-select').value;
            const thinkingLevel = document.getElementById('thinking-select').value;
            const useSearch = document.getElementById('search-toggle').checked;
            const useStream = document.getElementById('stream-toggle').checked;

            // Add user message to UI
            addMessage('user', text, attachedImages);

            // Clear input
            userInput.value = '';
            userInput.style.height = 'auto';
            const imagesCopy = [...attachedImages];
            attachedImages = [];
            renderPreviews();

            // Prepare Assistant response placeholder
            const botMsgDiv = addMessage('assistant', 'Thinking...');
            const contentDiv = botMsgDiv.querySelector('.content') || botMsgDiv;

            try {
                // For main_bridge.py: content must be a plain string
                // For main.py: content can be array (Vision API format)
                // We'll send plain string for compatibility with main_bridge.py
                const messages = [{ role: 'user', content: text }];

                const payload = {
                    model: model,
                    messages: messages,
                    stream: useStream
                };

                console.log('[Debug] Sending payload:', JSON.stringify(payload, null, 2));

                if (useStream) {
                    contentDiv.innerText = '';
                    const response = await fetch(`${baseUrl}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`HTTP ${response.status}: ${errorData.detail || response.statusText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');

                        for (let line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6);
                                if (dataStr === '[DONE]') continue;
                                try {
                                    const json = JSON.parse(dataStr);
                                    const delta = json.choices[0].delta.content;
                                    if (delta) {
                                        fullText += delta;
                                        contentDiv.innerText = fullText;
                                        chatWindow.scrollTop = chatWindow.scrollHeight;
                                    }
                                } catch (e) { }
                            }
                        }
                    }

                    // If no text was received via streaming, show what we got
                    if (!fullText) {
                        contentDiv.innerText = 'No response received (streaming may not be supported)';
                    }
                } else {
                    const response = await fetch(`${baseUrl}/v1/chat/completions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(`HTTP ${response.status}: ${errorData.detail || response.statusText}`);
                    }

                    const data = await response.json();

                    if (data.choices && data.choices[0]) {
                        contentDiv.innerText = data.choices[0].message.content;
                    } else {
                        contentDiv.innerText = 'Error: ' + (data.detail || 'Unknown response format');
                    }
                }
            } catch (e) {
                console.error('[API Error]', e);
                contentDiv.innerText = 'Error: ' + e.message;
            }

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }


        // Auto-scroll helper - ensures content is visible
        function autoScroll() {
            requestAnimationFrame(() => {
                chatWindow.scrollTop = chatWindow.scrollHeight;
                // Double-check after a short delay for dynamic content
                setTimeout(() => {
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 50);
            });
        }

        function addMessage(role, text, images = []) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            if (role === 'assistant') {
                const model = document.getElementById('model-select').options[document.getElementById('model-select').selectedIndex].text;
                const tl = document.getElementById('thinking-select').value;
                div.innerHTML = `<div class="thinking">✦ ${model} (${tl})</div><div class="content">${text}</div>`;
            } else {
                div.innerText = text;
                images.forEach(img => {
                    const imgEl = document.createElement('img');
                    imgEl.src = img;
                    imgEl.className = 'message-image';
                    div.appendChild(imgEl);
                });
            }

            chatWindow.appendChild(div);
            autoScroll();
            return div;
        }


        // Init
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        checkHealth();
        setInterval(() => {
            const baseUrl = document.getElementById('api-url').value.trim();
            if (baseUrl) checkHealth();
        }, 30000);
    </script>
</body>

</html>
