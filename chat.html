<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Studio Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #71717a;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            gap: 12px;
            padding: 16px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select,
        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: #e4e4e7;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: #8b5cf6;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            align-self: flex-end;
            color: white;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            align-self: flex-start;
        }

        .message.assistant pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .message.assistant code {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #prompt {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: #e4e4e7;
            font-size: 1rem;
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 150px;
        }

        #prompt:focus {
            border-color: #8b5cf6;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #a1a1aa;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: #8b5cf6;
        }

        .image-previews {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }

        button#send {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            height: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button#send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }

        button#send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            gap: 6px;
            padding: 20px;
        }

        .loading span {
            width: 10px;
            height: 10px;
            background: #8b5cf6;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .status {
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            color: #71717a;
        }

        .status.connected {
            color: #34d399;
        }

        .status.error {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>✨ Gemini Studio Chat</h1>
            <p class="subtitle">Powered by your local AI Studio API</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label>Model</label>
                <select id="model">
                    <option value="gemini-3-flash-preview">Gemini 3 Flash</option>
                    <option value="gemini-3-pro-preview">Gemini 3 Pro</option>
                    <option value="gemini-flash-latest">Flash Latest</option>
                </select>
            </div>
            <div class="control-group">
                <label>Thinking</label>
                <select id="thinking">
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                    <option value="Minimal" selected>Minimal</option>
                </select>
            </div>
            <div class="control-group">
                <label>API URL</label>
                <input type="text" id="apiUrl" value="http://localhost:8001" style="width: 200px;">
            </div>
        </div>

        <div class="chat-container" id="chat"></div>

        <div class="input-area">
            <div id="imagePreviews" class="image-previews"></div>
            <div class="input-row">
                <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                <button type="button" class="icon-btn" onclick="document.getElementById('fileInput').click()"
                    title="Add Images">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <textarea id="prompt" placeholder="Type your message..." rows="1"></textarea>
                <button id="send" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="status" id="status">Ready</div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const prompt = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');
        const status = document.getElementById('status');
        const fileInput = document.getElementById('fileInput');
        const imagePreviews = document.getElementById('imagePreviews');

        let selectedImages = []; // Array of base64 strings

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result;
                    selectedImages.push(base64);
                    renderPreviews();
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = ''; // Reset for next selection
        });

        function renderPreviews() {
            imagePreviews.innerHTML = '';
            selectedImages.forEach((img, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${img}">
                    <button class="remove" onclick="removeImage(${index})">&times;</button>
                `;
                imagePreviews.appendChild(div);
            });
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            renderPreviews();
        }

        // Auto-resize textarea
        prompt.addEventListener('input', () => {
            prompt.style.height = 'auto';
            prompt.style.height = prompt.scrollHeight + 'px';
        });

        // Enter to send (Shift+Enter for new line)
        prompt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(content, type, images = []) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;

            if (type === 'assistant') {
                msg.innerHTML = marked.parse(content);
            } else {
                msg.textContent = content;
                if (images.length > 0) {
                    const imgContainer = document.createElement('div');
                    imgContainer.style.display = 'flex';
                    imgContainer.style.gap = '8px';
                    imgContainer.style.marginTop = '8px';
                    imgContainer.style.flexWrap = 'wrap';

                    images.forEach(base64 => {
                        const img = document.createElement('img');
                        img.src = base64;
                        img.style.width = '100px';
                        img.style.height = '100px';
                        img.style.objectFit = 'cover';
                        img.style.borderRadius = '8px';
                        img.style.border = '1px solid rgba(255,255,255,0.2)';
                        imgContainer.appendChild(img);
                    });
                    msg.appendChild(imgContainer);
                }
            }

            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            return msg;
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'loading';
            loader.id = 'loader';
            loader.innerHTML = '<span></span><span></span><span></span>';
            chat.appendChild(loader);
            chat.scrollTop = chat.scrollHeight;
        }

        function hideLoading() {
            const loader = document.getElementById('loader');
            if (loader) loader.remove();
        }

        async function sendMessage() {
            const message = prompt.value.trim();
            if (!message && selectedImages.length === 0) return;

            const model = document.getElementById('model').value;
            const thinking = document.getElementById('thinking').value;
            const apiUrl = document.getElementById('apiUrl').value;

            // Capture image data before resetting
            const imagesToSend = [...selectedImages];

            addMessage(message, 'user', imagesToSend);
            prompt.value = '';
            prompt.style.height = 'auto';
            selectedImages = [];
            renderPreviews();

            sendBtn.disabled = true;
            showLoading();
            status.textContent = 'Generating...';
            status.className = 'status';

            try {
                const startTime = Date.now();

                const response = await fetch(`${apiUrl}/v1/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        model: model,
                        thinking_level: thinking,
                        images: imagesToSend
                    })
                });

                const data = await response.json();
                hideLoading();

                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

                if (data.success) {
                    addMessage(data.response, 'assistant');
                    status.textContent = `✓ Response in ${elapsed}s`;
                    status.className = 'status connected';
                } else {
                    addMessage(`Error: ${data.error}`, 'error');
                    status.textContent = `✗ ${data.error}`;
                    status.className = 'status error';
                }
            } catch (err) {
                hideLoading();
                addMessage(`Connection error: ${err.message}`, 'error');
                status.textContent = `✗ ${err.message}`;
                status.className = 'status error';
            }

            sendBtn.disabled = false;
        }
    </script>
</body>

</html>
